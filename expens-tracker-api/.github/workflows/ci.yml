name: CI - API Tests 🚀

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: expens-tracker-api/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: expens-tracker-api

      - name: Run Tests
        run: npm test
        working-directory: expens-tracker-api
